name: Build macOS and Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.kind }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
            kind: installer
            extension: dmg
            tauri_args: --bundles dmg
          - os: windows-latest
            platform: windows
            arch: x64
            kind: installer
            extension: exe
            tauri_args: --bundles nsis
          - os: windows-latest
            platform: windows
            arch: x64
            kind: portable
            extension: exe
            tauri_args: --no-bundle

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const expected = process.env.RELEASE_TAG.replace(/^v/, "");
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
          const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const cargoLock = fs.readFileSync("src-tauri/Cargo.lock", "utf8").match(/\[\[package\]\][\s\S]*?^name = "psd-manager"$\r?\n^version = "([^"]+)"/m)?.[1];
          const versions = [packageJson.version, packageLock.version, packageLock.packages?.[""].version, tauri.version, cargo, cargoLock];
          if (versions.some((version) => version !== expected)) {
            throw new Error(`发布 tag ${expected} 与本地版本不一致：${versions.join(", ")}`);
          }
          NODE

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build package
        run: npm run tauri -- build ${{ matrix.tauri_args }}

      - name: Prepare release artifact
        id: artifact
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_KIND: ${{ matrix.kind }}
          RELEASE_EXTENSION: ${{ matrix.extension }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.cwd();
          const platform = process.env.RELEASE_PLATFORM;
          const arch = process.env.RELEASE_ARCH;
          const kind = process.env.RELEASE_KIND;
          const extension = process.env.RELEASE_EXTENSION;
          const packageJson = JSON.parse(fs.readFileSync(path.join(root, "package.json"), "utf8"));
          const version = packageJson.version;
          const outputDirectory = path.join(root, "dist-release");
          fs.mkdirSync(outputDirectory, { recursive: true });

          function firstFile(directory, suffix) {
            if (!fs.existsSync(directory)) throw new Error(`构建目录不存在：${directory}`);
            const name = fs.readdirSync(directory).filter((entry) => entry.endsWith(suffix)).sort()[0];
            if (!name) throw new Error(`构建目录中未找到 ${suffix} 产物：${directory}`);
            return path.join(directory, name);
          }

          let source;
          if (platform === "windows" && kind === "portable") {
            source = path.join(root, "src-tauri", "target", "release", "psd-manager.exe");
            if (!fs.existsSync(source)) throw new Error(`未找到 Windows 免安装程序：${source}`);
          } else if (platform === "macos" && kind === "installer") {
            source = firstFile(path.join(root, "src-tauri", "target", "release", "bundle", "dmg"), ".dmg");
          } else if (platform === "windows" && kind === "installer") {
            source = firstFile(path.join(root, "src-tauri", "target", "release", "bundle", "nsis"), ".exe");
          } else {
            throw new Error(`不支持的产物组合：${platform}/${kind}`);
          }

          const artifactName = `PsdManager-${version}-${platform}-${arch}-${kind}.${extension}`;
          const destination = path.join(outputDirectory, artifactName);
          fs.copyFileSync(source, destination);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${artifactName}\nversion=${version}\npath=${path.relative(root, destination)}\n`);
          console.log(`已准备产物：${path.relative(root, destination)}`);
          NODE

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release artifacts
        run: |
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          find release-assets -maxdepth 1 -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Psd Manager ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            设备密码管理工具发布包。

            可下载 macOS 和 Windows 对应系统的安装包或免安装包。

            macOS 当前未配置 Apple Developer ID 签名和公证。如果 macOS 提示“已损坏，无法打开”，请将应用拖入“应用程序”后执行：

            ```bash
            xattr -dr com.apple.quarantine "/Applications/Psd Manager.app"
            ```
          files: release-assets/*
